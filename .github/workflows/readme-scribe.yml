name: Update README

# Regenerates README.md from templates/README.md.tpl once a day and on every
# push. README_SCRIBE_TOKEN is a classic personal access token with no scopes,
# which limits it to public data, authorised for SSO on runkora. A fine-grained
# token cannot read stargazers, which markscribe queries for every repo. The
# default GITHUB_TOKEN queries as the Actions bot and would return the bot's
# activity instead of this account's.
#
# Every third-party step is pinned to a commit or image digest because the
# token is passed to it. markscribe runs directly from its image by digest,
# because muesli/readme-scribe only wraps the image at its mutable latest tag.
on:
  push:
    branches: [main]
    paths: [templates/**, .github/workflows/readme-scribe.yml]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker://fribbledom/markscribe@sha256:97576ac6779e1be65eb9a11a241f5b873b4eae065cd9a9e1f1241add2cae60f4
        env:
          GITHUB_TOKEN: ${{ secrets.README_SCRIBE_TOKEN }}
        with:
          args: -write README.md templates/README.md.tpl

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: readme-scribe
          commit_user_email: actions@github.com
          commit_author: readme-scribe <actions@github.com>
